name: Android

on: [push, pull_request]

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.8.*
  QT_MODULES: qtbase qtsvg qtdeclarative

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          submodules: 'recursive'
      - name: Query aqt
        run:
          aqt list-qt all_os android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Qt 6 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          cache: true
          set-env: true

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DVGC_QT_VERSION=6 \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK"/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NDK="$ANDROID_NDK" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Deploy APK (androiddeployqt)
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          ADQT=$(find "$QT_ROOT_DIR/bin" -name "androiddeployqt" | head -n1)
          if [ -z "$ADQT" ]; then
            echo "androiddeployqt not found"
            exit 1
          fi
          MANIFEST="build/$BUILD_TYPE/bin/vgc_illustration_app/AndroidManifest.xml"
          mkdir -p $(dirname $MANIFEST)
          if [ ! -f "$MANIFEST" ]; then
            cat > "$MANIFEST" << 'EOF'
            <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                package="io.vgc.illustration" android:versionCode="1" android:versionName="alpha">
                <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="29"/>
                <application android:label="VGC Illustration" android:icon="@mipmap/ic_launcher">
                    <activity android:name="org.qtproject.qt5.android.bindings.QtActivity"
                        android:configChanges="orientation|screenSize|smallestScreenSize"
                        android:label="VGC Illustration">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN"/>
                            <category android:name="android.intent.category.LAUNCHER"/>
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF
          fi
          $ADQT --input "$MANIFEST" --output build/android --android-platform android-29 --gradle
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vgc-android-apk
          path: build/android/*.apk
