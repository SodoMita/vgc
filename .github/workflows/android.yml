name: Android APK

on:
  push:
    branches:
      - build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUILD_DIR: build-android
  ANDROID_PLATFORM: android-34
  ANDROID_BUILD_TOOLS: 34.0.0
  NDK_VERSION: 26.1.10909125
  QT_VERSION: 6.7.3
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            cmake \
            curl \
            git \
            ninja-build \
            pkg-config \
            python3-dev \
            unzip

      - name: Build APK
        run: |
          bash tools/android/build_apk.sh "$BUILD_DIR"

      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find "$BUILD_DIR" -name '*.apk' -type f | head -n1)
          if [ -z "$apk_path" ]; then
            echo "No APK was produced" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          ls -lh "$apk_path"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgc-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
