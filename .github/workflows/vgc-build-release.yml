name: Build VGC installable artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

env:
  BUILD_TYPE: Release

defaults:
  run:
    shell: bash

jobs:
  windows:
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'windows' }}
    runs-on: windows-2019
    env:
      MSVC_VERSION: 2019
      QT_VERSION: 5.15.2
      PYTHON_VERSION: 3.7
      VCPKG_VERSION: 2025.01.13
      VCPKG_INSTALL_OPTIONS: --binarysource=clear
      VCPKG_BUILD_TYPE: release
      VCPKG_PACKAGES: freetype;harfbuzz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install Qt
        working-directory: ${{ github.workspace }}/..
        shell: pwsh
        run: |
          $url = "https://vgcci.blob.core.windows.net/vgc-ci"
          $dirname = "qt-${env:QT_VERSION}-msvc${env:MSVC_VERSION}_64"
          $filename = "$dirname.zip"
          C:/msys64/usr/bin/wget.exe --progress=dot:giga "$url/$filename"
          unzip -q $filename -d .
          echo "Qt5Location=$pwd/$dirname" >> ${env:GITHUB_ENV}

      - name: Configure vcpkg
        run: |
          PARENT="$GITHUB_WORKSPACE"
          echo "VCPKG_ROOT_PARENT=$PARENT" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$PARENT/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_FILE=$PARENT/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "VCPKG_OVERLAY_TRIPLETS=$PARENT/vcpkg/custom-triplets" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-rel" >> $GITHUB_ENV

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg=${{ env.VCPKG_VERSION }} triplet=${{ env.VCPKG_DEFAULT_TRIPLET }} msvc=${{ env.MSVC_VERSION }} packages=${{ env.VCPKG_PACKAGES }}

      - name: Install vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: ${{ env.VCPKG_ROOT_PARENT }}
        run: |
          git clone --depth=1 --branch %VCPKG_VERSION% https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install vcpkg packages
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          rm "$GITHUB_WORKSPACE/vcpkg.json"
          mkdir "$VCPKG_OVERLAY_TRIPLETS"
          TRIPLET_FILE="$VCPKG_OVERLAY_TRIPLETS/$VCPKG_DEFAULT_TRIPLET.cmake"
          cp triplets/x64-windows.cmake "$TRIPLET_FILE"
          echo "set(VCPKG_BUILD_TYPE $VCPKG_BUILD_TYPE)" >> "$TRIPLET_FILE"
          (IFS=';'; ./vcpkg.exe \
            --vcpkg-root="$VCPKG_ROOT" \
            --overlay-triplets="$VCPKG_OVERLAY_TRIPLETS" \
            --triplet="$VCPKG_DEFAULT_TRIPLET" \
            $VCPKG_INSTALL_OPTIONS \
            install $VCPKG_PACKAGES)

      - name: Setup Developer Command Prompt for VS
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_DEFAULT_TRIPLET" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DPython_ROOT_DIR="$pythonLocation" \
            -DQt5_DIR="$Qt5Location/lib/cmake/Qt5" \
            -DWiX="$WIX"

      - name: Build
        working-directory: ${{ github.workspace }}/build
        run: cmake --build .

      - name: Package
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --target deploy

      - name: Collect artifacts
        run: |
          mkdir out
          cp build/deploy/$BUILD_TYPE/VGC*.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: vgc-windows
          path: out/*

  macos:
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'macos' }}
    runs-on: macos-13
    env:
      QT_VERSION: 5.15.2
      PYTHON_VERSION: 3.8
      PARALLEL_JOBS: 5
      MACOSX_DEPLOYMENT_TARGET: 10.13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Adding Tcl/Tk Symlink
        run: ln -sf /usr/local/opt/tcl-tk@8 /usr/local/opt/tcl-tk

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false

      - name: Install other dependencies
        run: |
          brew install freetype harfbuzz
          pip install dmgbuild

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DPython_ROOT_DIR="$pythonLocation" \
            -DQt5_DIR="$GITHUB_WORKSPACE/Qt/$QT_VERSION/clang_64/lib/cmake/Qt5"

      - name: Build
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --parallel $PARALLEL_JOBS

      - name: Package
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --target deploy --parallel $PARALLEL_JOBS

      - name: Collect artifacts
        run: |
          mkdir out
          cp build/deploy/$BUILD_TYPE/VGC*.dmg out/

      - uses: actions/upload-artifact@v4
        with:
          name: vgc-macos
          path: out/*

  linux:
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'linux' }}
    runs-on: ubuntu-24.04
    env:
      CONTAINER: vgcsoftware/vgc-ci-ubuntu-18.04:2023-03-08.0
      QT_VERSION: 5.12.5
      PARALLEL_JOBS: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          submodules: recursive

      - name: Start Docker Container
        run: |
          docker pull $CONTAINER
          docker run --name build-container -d -v ${{ github.workspace }}:/workspace $CONTAINER tail -f /dev/null

      - name: Configure
        env:
          SCRIPT: |
            cd /workspace && mkdir build && cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
              -DQt5_DIR="/opt/qt/${{ env.QT_VERSION }}/gcc_64/lib/cmake/Qt5"
        run: docker exec build-container bash -c "$SCRIPT"

      - name: Build
        env:
          SCRIPT: |
            cd /workspace/build
            cmake --build . --parallel ${{ env.PARALLEL_JOBS }}
        run: docker exec build-container bash -c "$SCRIPT"

      - name: Package
        env:
          SCRIPT: |
            cd /workspace/build
            cmake --build . --target deploy --parallel ${{ env.PARALLEL_JOBS }}
        run: docker exec build-container bash -c "$SCRIPT"

      - name: Collect artifacts
        run: |
          mkdir out
          cp build/deploy/$BUILD_TYPE/vgc*.AppImage out/

      - uses: actions/upload-artifact@v4
        with:
          name: vgc-linux
          path: out/*

  release:
    needs: [windows, macos, linux]
    if: always() && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: vgc-windows
          path: release-assets

      - name: Download macOS artifact
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: vgc-macos
          path: release-assets

      - name: Download Linux artifact
        if: needs.linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: vgc-linux
          path: release-assets

      - name: Set tag
        run: echo "TAG=manual-build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: VGC manual build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: release-assets/*
