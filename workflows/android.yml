name: Android

on: [push, pull_request]

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.7.3
  # Qt6 note: there is no "qtopenGL"/"qtopenGLwidgets" module — OpenGL and
  # OpenGLWidgets are part of qtbase. qtdeclarative is not used by this app.
  # QtSvg is included in the base Qt 6.7 Android/Desktop archives used here.
  QT_MODULES: ""
  ANDROID_PLATFORM: android-34
  ANDROID_BUILD_TOOLS: 34.0.0
  NDK_VERSION: 26.1.10909125
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      # VGC requires Python development files (headers + libpython) for its
      # pybind11-based CMake configuration: CMakeLists.txt line 153 does
      #   find_package(Python 3.6 COMPONENTS Interpreter Development REQUIRED)
      # The runner's default Python (3.12) has no dev files and, moreover,
      # the pinned third/pybind11 (2.10.x) officially supports up to Python
      # 3.11, so we install a full 3.11 with dev files.
      - name: Install Python 3.11 (with dev files)
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev

      # Qt6 Android cross-compilation requires the host Qt (for moc, uic,
      # rcc, etc.), passed to CMake as QT_HOST_PATH.
      - name: Install Qt 6 host (desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          set-env: true

      - name: Record host Qt path
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt 6 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          cache: true
          set-env: true

      # FreeType and HarfBuzz must also be cross-built for Android (vgc links
      # them). They are installed into the NDK sysroot so that CMake's find
      # modules locate them without ever picking up host libraries. They are
      # built as static libraries so that they end up inside
      # libvgc_illustration_app_<abi>.so (avoids packaging extra .so files).
      - name: Cross-build FreeType (arm64-v8a)
        run: |
          export SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          curl -sL -o /tmp/freetype.tar.gz https://codeload.github.com/freetype/freetype/tar.gz/refs/tags/VER-2-13-2
          tar xzf /tmp/freetype.tar.gz -C /tmp
          cmake -S /tmp/freetype-VER-2-13-2 -B /tmp/ft-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$SYSROOT/usr/local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_ZLIB=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/ft-build --parallel
          cmake --install /tmp/ft-build

      - name: Cross-build HarfBuzz (arm64-v8a)
        run: |
          export SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          curl -sL -o /tmp/harfbuzz.tar.gz https://codeload.github.com/harfbuzz/harfbuzz/tar.gz/refs/tags/8.3.0
          tar xzf /tmp/harfbuzz.tar.gz -C /tmp
          cmake -S /tmp/harfbuzz-8.3.0 -B /tmp/hb-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$SYSROOT/usr/local" \
            -DCMAKE_PREFIX_PATH="$SYSROOT/usr/local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DHB_HAVE_FREETYPE=ON -DHB_BUILD_UTILS=OFF \
            -DHB_BUILD_TESTS=OFF -DHB_BUILD_BENCHMARKS=OFF -DHB_BUILD_SUBSET=OFF \
            -DHB_HAVE_GLIB=OFF -DHB_HAVE_GRAPHITE2=OFF -DHB_HAVE_ICU=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/hb-build --parallel
          cmake --install /tmp/hb-build
          # Remove harfbuzz's CMake config: it requires a Threads::Threads
          # target that VGC's configure doesn't provide; VGC then falls back
          # to its own Findharfbuzz.cmake module.
          rm -rf "$SYSROOT/usr/local/lib/cmake/harfbuzz"

      # Wrap the NDK toolchain: its default find modes are ONLY (sysroot),
      # which would hide the host Python dev files that VGC needs to
      # configure its pybind11-based build system.
      - name: Create toolchain wrapper
        run: |
          cat > "$RUNNER_TEMP/vgc-android.toolchain.cmake" <<EOF
          include("$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake")
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)
          EOF

      - name: Configure
        run: |
          export SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DVGC_QT_VERSION=6 \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DPython_EXECUTABLE=/usr/bin/python3.11 \
            -DPython_ROOT_DIR=/usr \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vgc-android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
            -DANDROID_STL=c++_shared \
            -DANDROID_NDK="$ANDROID_NDK_HOME" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DHARFBUZZ_DIR="$SYSROOT/usr/local" \
            -DCMAKE_PREFIX_PATH="$SYSROOT/usr/local"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Locate APK
        run: |
          APK=$(find build -name '*.apk' -type f | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found after build"
            exit 1
          fi
          echo "APK: $APK"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vgc-android-apk
          path: build/android/**/*.apk
